name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Official Keystore File
        run: |
          keytool -genkeypair -keystore xdrip2_official.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xDrip2,O=Android,C=BG"
          base64 -w 0 xdrip2_official.keystore > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE_BACKUP
          path: |
            xdrip2_official.keystore
            KEYSTORE_BASE64.txt
