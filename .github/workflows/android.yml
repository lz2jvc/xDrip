name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish public GitHub Release? (Check ONLY when ready for users)'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'What is new in this release? (Short description)'
        required: false
        type: string
        default: 'Bug fixes and stability improvements.'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Align and Sign APK with Official Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > xdrip2.keystore
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          zip -d "$RAW_APK" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" app/build/outputs/apk/xDrip2-signed.apk
          "$BUILD_TOOLS/apksigner" sign --ks xdrip2.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android app/build/outputs/apk/xDrip2-signed.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/xDrip2-signed.apk | grep "SHA-256"
      - name: Get Current Date
        id: date
        run: echo "today=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: xDrip2-APK
          path: app/build/outputs/apk/xDrip2-signed.apk
      - name: Create GitHub Release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.today }}-b${{ github.run_number }}
          name: xDrip 2 (${{ steps.date.outputs.today }})
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/xDrip2-signed.apk
          make_latest: true
