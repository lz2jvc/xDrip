name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create Deterministic Forever Keystore
        env:
          SEED: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          python3 -c 'import os,hashlib; s=os.environ["SEED"].encode(); open("rnd.bin","wb").write(b"".join(hashlib.sha512(s+str(i).encode()).digest() for i in range(200)))'
          openssl genrsa -rand rnd.bin -out key.pem 2048
          openssl req -new -x509 -key key.pem -out cert.pem -days 10000 -subj "/CN=xDrip2/O=Android/C=BG" -set_serial 123456789
          openssl pkcs12 -export -in cert.pem -inkey key.pem -out ~/.android/debug.keystore -name androiddebugkey -passout pass:android
          rm -f rnd.bin key.pem cert.pem
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1:|SHA256:"
      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xDrip2-APK
          path: app/build/outputs/apk/**/*.apk
